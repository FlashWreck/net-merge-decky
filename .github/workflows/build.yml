name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test -v ./...

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: build backend static binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/net-merge ./cmd/net-merge
          chmod +x bin/net-merge

      - name: package plugin
        run: |
          mkdir -p package/net-merge-decky/dist package/net-merge-decky/bin
          cp plugin.json package.json main.py LICENSE README.md THIRD-PARTY-NOTICES.md package/net-merge-decky/
          cp dist/index.js package/net-merge-decky/dist/
          cp bin/net-merge package/net-merge-decky/bin/
          chmod +x package/net-merge-decky/bin/net-merge
          cd package && zip -r ../net-merge-decky.zip net-merge-decky

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-merge-decky
          path: net-merge-decky.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: net-merge-decky.zip
          generate_release_notes: true
